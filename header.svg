<svg width="700" height="120" viewBox="0 0 700 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="silverGray" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94A3B8" />
      <stop offset="50%" stop-color="#6B7280" />
      <stop offset="100%" stop-color="#374151" />
    </linearGradient>
    <clipPath id="clip1">
      <rect x="175" y="15" height="45">
        <animate attributeName="width" from="0" to="350" dur="1s" begin="0s" fill="freeze" />
      </rect>
    </clipPath>
    <clipPath id="clip2">
      <rect x="204" y="68" height="30">
        <animate id="c2" attributeName="width" from="0" to="292" dur="1.2s" begin="typing1.end" fill="freeze" />
      </rect>
    </clipPath>
  </defs>

  <g clip-path="url(#clip1)">
    <text x="350" y="54" text-anchor="middle" textLength="350" lengthAdjust="spacingAndGlyphs"
      font-family="JetBrains Mono, Consolas, monospace" font-size="34" font-weight="700" fill="url(#silverGray)">Miguel Nascimento</text>
  </g>

  <g clip-path="url(#clip2)">
    <text x="350" y="90" text-anchor="middle" textLength="292" lengthAdjust="spacingAndGlyphs"
      font-family="JetBrains Mono, Consolas, monospace" font-size="18" font-weight="500" fill="url(#silverGray)">Desenvolvedor Back-end Java</text>
  </g>


  <rect x="0" y="0" width="0" height="0" opacity="0">
    <animate id="typing1" attributeName="width" from="0" to="1" dur="1s" begin="0s" fill="freeze" />
  </rect>

  <rect x="175" y="20" width="3" height="34" fill="url(#silverGray)">
    <animate attributeName="x" from="175" to="525" dur="1s" begin="0s" fill="freeze" />
    <animate attributeName="opacity" from="1" to="0" dur="1ms" begin="typing1.end" fill="freeze" />
  </rect>

  <rect x="204" y="72" width="3" height="20" fill="url(#silverGray)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="1ms" begin="typing1.end" fill="freeze" />
    <animate attributeName="x" from="204" to="496" dur="1.2s" begin="typing1.end" fill="freeze" />
    <animate attributeName="opacity" values="1;0;1" dur="0.8s" begin="c2.end" repeatCount="indefinite" />
  </rect>
</svg>
